# Talks and conferences. This one file feeds two places:
#   - the Presentations list on the Research page (_pages/research-projects.md)
#   - the map on the Notes page (_includes/talks-map.html)
#
# papers:   one entry per paper, in the order the Research page lists them.
#           List each paper's talks newest first.
# attended: conferences attended without presenting. These appear on the map only.
#
# Fields for each talk (and each attended conference):
#   venue      conference name, as printed
#   city       "City, ST" or "City, Country"; talks in the same city share one map pin
#   date       three-letter month and year, as printed ("Oct. 2026", "May 2027")
#   scheduled  true until the conference has happened; adds "(scheduled)" and draws a hollow pin
#   lat, lng   coordinates of the city
#   photo      optional; a compressed copy in images/talks/ (800 px wide, EXIF/GPS removed, otherwise unedited).
#              Full-size originals go in images/talks/_originals/, which git and Jekyll ignore.
#   photo_alt  what the photo shows; required whenever photo is set

